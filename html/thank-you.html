			body,html{margin:0px;padding:0px;box-sizing:border-box;}

			.show_hide{display:none;}
			.thank-you-sec{background:#212121;}

			/*      .thank-you-sec .thank-you-wp{min-height:calc(100vh - 300px);padding:180px 0px;position:relative;}*/
			.thank-you-sec .thank-you-wp{min-height:100vh;padding:100px 0px 150px;position:relative;display:flex;align-items:center;justify-content:center;}
			.thank-you-sec .thank-you-wp .social-media-ty{position:absolute;left:0px;right:0px;bottom:70px;}
			.social-media-ty{text-align:center;}
			.social-media-ty p{font-size:20px;color:#fff;margin-bottom:25px;line-height:25px;font-weight:500;}
			.social-media-ty ul.social-link{display:flex;align-items:center;justify-content:center;gap: 15px;padding: 0px;}
			.social-media-ty ul.social-link li{display:inline-block;margin:0px;}
			.thank-you-contant{text-align:center;margin-bottom: 40px;}
			.thank-you-text h2.orange_text{font-size:48px;line-height:58px;color:#FCBC14!important;margin:30px 0px 20px;}
			.thank-you-icon img{max-width:75px;}

			/*      .thank-you-text p{font-size:24px;margin-bottom:0px;color:#000;}*/
			.thank-you-text p{font-size:18px;margin-bottom:0px;color:#fff;line-height:26px;font-weight:400;}

			.social-icon{width:35px;height:35px;display:inline-block;}
			.social-icon svg{max-width:100%;width:100%;height:auto;}

			@media (max-width:767.98px){
				.thank-you-icon img{max-width:55px;}
				.thank-you-text h2.orange_text{font-size:38px;line-height:50px;margin:25px 0px 15px;}
				.thank-you-text p{font-size:18px;}
				.social-media-ty p{font-size:18px;}
			}

		</style>
